[workspace]
resolver = "3"
members = [
    "crates/syntax",
    "crates/project",
    "crates/hir",
    "crates/mir",
    "crates/interp",
    "crates/difftest",
    "crates/corpus",
    "crates/cli",
    "tools/recorder",
]

[workspace.package]
version = "0.0.5-dev"
edition = "2024"
rust-version = "1.85"
repository = "https://github.com/FeliceMente/ferrobasic"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "deny"

[profile.release]
lto = "thin"
