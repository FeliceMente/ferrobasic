# Keep build/package commands here so this workflow can build older tags too.
name: Release binaries

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to build (for example v0.1.1)
        required: true
        type: string
      dry_run:
        description: Save workflow artifacts without changing the release
        default: true
        type: boolean
  # Exercise workflow changes before merging; this is always a dry run.
  pull_request:
    branches: [dev]
    paths: [.github/workflows/release.yml]

permissions:
  contents: read

concurrency:
  group: release-binaries-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  source:
    name: Resolve source and version
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      version: ${{ steps.source.outputs.version }}
      tag: ${{ steps.source.outputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - id: source
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          PR_COMMIT: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$TAG" ]]; then
            [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || {
              echo "Expected a release tag v<version>" >&2; exit 1;
            }
            git fetch --no-tags origin "refs/tags/$TAG:refs/tags/$TAG"
            commit=$(git rev-parse "refs/tags/$TAG^{commit}")
            version=${TAG#v}
          else
            # Pull-request dry runs build the branch, not its merge commit.
            commit=$PR_COMMIT
            git fetch --no-tags origin "$commit"
            git checkout --detach "$commit"
            version=$(cargo metadata --no-deps --format-version 1 | python3 -c \
              'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "ferro-cli"))')
          fi
          printf 'commit=%s\nversion=%s\ntag=%s\n' "$commit" "$version" "$TAG" >> "$GITHUB_OUTPUT"

  build:
    name: Build and verify (${{ matrix.platform }})
    needs: source
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - platform: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - platform: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          # Public preview: failures block publishing, just like other platforms.
          - platform: windows-arm64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
          - platform: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-x64
            os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.source.outputs.version }}
      PLATFORM: ${{ matrix.platform }}
      TARGET: ${{ matrix.target }}
      # Link the C runtime statically on Windows, as .cargo/config.toml does,
      # also for tags built before that file existed. Other targets ignore it.
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
      CARGO_TARGET_AARCH64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      # rust-toolchain.toml selects stable; rustup is installed on each runner.
      - run: rustup target add ${{ matrix.target }}
      - name: Workspace tests
        run: cargo test --locked --workspace
      - name: Build ferro for standalone conformance
        run: cargo build --locked -p ferro-cli
      - name: Standalone conformance
        run: cargo run --locked -p ferro-difftest -- --target standalone
      - name: Build only ferro for distribution
        run: cargo build --locked --release -p ferro-cli --bin ferro --target ${{ matrix.target }}
      - name: Verify macOS ad hoc signature
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          binary="target/$TARGET/release/ferro"
          if [[ "$PLATFORM" == macos-x64 ]] && ! codesign --verify --strict "$binary"; then
            codesign --force --sign - "$binary"
          fi
          codesign --verify --strict "$binary"
          codesign --display --verbose=4 "$binary" 2>&1 | grep -Fx 'Signature=adhoc'
      - name: Verify release binary and standalone conformance (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          binary="$PWD/target/$TARGET/release/ferro"
          actual=$("$binary" version)
          echo "$actual"
          [[ "$actual" == "ferro $VERSION ($PLATFORM)" ]]
          cargo run --locked -p ferro-difftest -- --target standalone --ferro "$binary"
      - name: Verify static Linux bundle
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          # Same build and recorded smoke test as scripts/check-static-linux.sh,
          # also for aarch64 (the older script supports x86_64 only).
          binary="$PWD/target/$TARGET/release/ferro"
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          "$binary" bundle tests/conformance/level0/prices_map.bas -o "$work/prices_map"
          for executable in "$binary" "$work/prices_map"; do
            file "$executable"
            file "$executable" | grep -Eq 'statically linked|static-pie linked'
          done
          "$work/prices_map" | diff - tests/conformance/level0/prices_map.expected
      - name: Verify release binary and standalone conformance (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binary = Join-Path $PWD "target/$env:TARGET/release/ferro.exe"
          $actual = & $binary version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output $actual
          if ($actual -cne "ferro $env:VERSION ($env:PLATFORM)") { throw "Unexpected version/platform" }
          cargo run --locked -p ferro-difftest -- --target standalone --ferro $binary
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify static Windows runtime and bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Neither ferro.exe nor a program it bundles may need the Visual C++
          # Redistributable: the hosted runners have it, users may not.
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vswhere -latest -products * -find 'VC\Tools\MSVC\**\dumpbin.exe' | Select-Object -First 1
          if (-not $dumpbin) { throw "dumpbin.exe not found" }
          $binary = Join-Path $PWD "target/$env:TARGET/release/ferro.exe"
          $work = Join-Path $env:RUNNER_TEMP 'static-bundle'
          New-Item -ItemType Directory -Force $work | Out-Null
          $bundled = Join-Path $work 'prices_map.exe'
          & $binary bundle tests/conformance/level0/prices_map.bas -o $bundled
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($executable in $binary, $bundled) {
            $dependents = & $dumpbin /nologo /dependents $executable
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $dependents | Write-Output
            if ($dependents | Select-String -Pattern 'vcruntime|msvcp|api-ms-win-crt-') {
              throw "$executable depends on the Visual C++ runtime"
            }
          }
          $actual = & $bundled
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $expected = Get-Content tests/conformance/level0/prices_map.expected
          if (($actual -join "`n") -cne ($expected -join "`n")) { throw "Bundled prices_map output differs from its recording" }
      - name: Package Unix archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir staging dist
          cp "target/$TARGET/release/ferro" LICENSE THIRD-PARTY-NOTICES.txt staging/
          # Avoid AppleDouble entries for macOS extended attributes.
          COPYFILE_DISABLE=1 tar -czf "dist/ferro-$VERSION-$PLATFORM.tar.gz" -C staging ferro LICENSE THIRD-PARTY-NOTICES.txt
      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory staging, dist
          Copy-Item "target/$env:TARGET/release/ferro.exe", LICENSE, THIRD-PARTY-NOTICES.txt staging/
          Compress-Archive -Path staging/ferro.exe, staging/LICENSE, staging/THIRD-PARTY-NOTICES.txt -DestinationPath "dist/ferro-$env:VERSION-$env:PLATFORM.zip"
      - name: Keep verified archive
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: binary-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  checksums:
    name: Collect all archives and checksums
    needs: [source, build]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.source.outputs.version }}
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: binary-*
          merge-multiple: true
          path: dist
      - name: Check archive set and generate SHA256SUMS
        working-directory: dist
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          import tarfile
          import zipfile

          version = os.environ['VERSION']
          expected = {
              f'ferro-{version}-{platform}.{extension}'
              for platform, extension in [
                  ('linux-x64', 'tar.gz'), ('linux-arm64', 'tar.gz'),
                  ('windows-x64', 'zip'), ('windows-arm64', 'zip'),
                  ('macos-arm64', 'tar.gz'), ('macos-x64', 'tar.gz'),
              ]
          }
          assert {p.name for p in Path('.').iterdir()} == expected, 'Incomplete archive set'
          for name in sorted(expected):
              if name.endswith('.zip'):
                  with zipfile.ZipFile(name) as archive:
                      members = archive.namelist()
                  binary = 'ferro.exe'
              else:
                  with tarfile.open(name) as archive:
                      members = archive.getnames()
                  binary = 'ferro'
              assert sorted(members) == sorted([binary, 'LICENSE', 'THIRD-PARTY-NOTICES.txt']), name
          PY
          sha256sum ferro-* > SHA256SUMS
          sha256sum --check SHA256SUMS
          cat SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error

  upload:
    name: Attach assets to published release
    needs: [source, checksums]
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-assets
          path: dist
      - name: Upload all verified assets
        working-directory: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.source.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          # A typo must not create a release; drafts are not published releases.
          [[ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" == false ]]
          sha256sum --check SHA256SUMS
          gh release upload "$TAG" ferro-* SHA256SUMS --clobber
