# Continuous integration (docs/compatibility-testing.md, "CI").
#
# Runs on pull requests into `main` (releases) and on demand ("Run
# workflow"), not on every pull request into `dev`: the repository is
# private, so every minute comes out of the owner's Actions allowance, and
# macOS minutes count ten times. Pull requests into `dev` are checked
# locally (AGENTS.md, "Before closing a task").

name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  lint:
    name: fmt and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      # rust-toolchain.toml selects the toolchain and its components.
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is Apple Silicon; macos-15-intel is the last Intel image.
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      # Keep line endings as committed: test data files are read byte for byte.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  static-linux:
    name: static Linux binary (musl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - run: rustup target add x86_64-unknown-linux-musl
      - run: cargo build --release -p ferro-cli --target x86_64-unknown-linux-musl
      - name: Bundle a program and check it is static and runs
        # An explicit bash runs with pipefail, so a failing binary fails the step.
        shell: bash
        run: |
          ferro=target/x86_64-unknown-linux-musl/release/ferro
          "$ferro" bundle tests/conformance/level0/prices_map.bas -o prices_map
          file prices_map
          file prices_map | grep -Eq 'statically linked|static-pie linked'
          ./prices_map | diff - tests/conformance/level0/prices_map.provisional
