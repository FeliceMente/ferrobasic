# Continuous integration (docs/compatibility-testing.md, "CI").
#
# Runs on pull requests into `main` (releases) and on demand ("Run
# workflow"), not on every pull request into `dev`, which would wait on
# four platforms at every push. Pull requests into `dev` are checked
# locally (AGENTS.md, "Before closing a task").

name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  lint:
    name: fmt and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      # rust-toolchain.toml selects the toolchain and its components.
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is Apple Silicon; macos-15-intel is the last Intel image.
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      # Keep line endings as committed: test data files are read byte for byte.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  real-world-corpus:
    name: real-world corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      # Downloads the projects tests/corpus/corpus.toml references, checking
      # their SHA-256, then runs the tests that need them.
      - run: cargo run -p ferro-corpus --bin ferro-corpus-fetch
      - run: cargo test -p ferro-syntax --test projects -- --ignored
      - run: cargo test -p ferro-project --test projects -- --ignored

  static-linux:
    name: static Linux binary (musl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - run: rustup target add x86_64-unknown-linux-musl
      # The build, bundle and checks, shared with scripts/check-all.sh.
      - run: scripts/check-static-linux.sh
