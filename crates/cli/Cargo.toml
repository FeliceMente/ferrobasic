[package]
name = "ferro-cli"
description = "The `ferro` command: build, run, repl, check, test, fmt."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[lib]
name = "ferro_cli"
path = "src/lib.rs"

[[bin]]
name = "ferro"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
ferro-project = { path = "../project" }
ferro-syntax = { path = "../syntax" }
ferro-hir = { path = "../hir" }
ferro-mir = { path = "../mir" }
ferro-interp = { path = "../interp" }

# Embeds the program in a Mach-O section, so the result can be code-signed
# (`docs/spec/cli.md`, "Standalone binary format"). macOS only.
[target.'cfg(target_os = "macos")'.dependencies]
libsui = "0.16.4"

# Whether two paths are the same file (hard links included) on Windows, where
# std has no stable file-identity API; protects `ferro bundle`'s input and
# `ferro` itself from being overwritten. Unix compares device and inode.
[target.'cfg(not(unix))'.dependencies]
same-file = "1.0.6"

[dev-dependencies]
ferro-corpus = { path = "../corpus" }
ferro-difftest = { path = "../difftest" }
