[package]
name = "ferro-repl"
description = "Stateful interpreter sessions for FerroBASIC"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
ferro-syntax = { path = "../syntax" }
ferro-hir = { path = "../hir" }
ferro-mir = { path = "../mir" }
ferro-interp = { path = "../interp" }
# Native multiline prompt/validator support; no disk history or optional UI features.
# See docs/research/repl-line-editing.md for the library/toolchain comparison.
reedline = { version = "=0.49.0", default-features = false }
crossterm = { version = "0.29", default-features = false }
# Route Crossterm cursor queries to stderr during the serial input phase.
filedescriptor = "0.8.3"
