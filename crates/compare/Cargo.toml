[package]
name = "ferro-compare"
description = "Compares how two builds of ferro check generated programs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "ferro-compare"
path = "src/main.rs"

[lints]
workspace = true

[dev-dependencies]
# Every generated program must parse: the comparison is about checking.
ferro-syntax = { path = "../syntax" }
