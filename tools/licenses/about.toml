# cargo-about configuration for THIRD-PARTY-NOTICES.txt; see README.md here.
# In order of preference: where a crate offers a choice, the first licence
# listed here that it offers is the one used, and its text is reproduced.
accepted = [
    "MIT",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "Zlib",
    "0BSD",
    "Unlicense",
    "Apache-2.0",
    "Unicode-3.0",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
private = { ignore = true }

# Licence files cargo-about does not recognise on its own. The Windows crates
# name theirs `license-mit`. libm keeps its MIT terms, the Apache-2.0 text and
# the musl copyright notices in one `LICENSE.txt`; the whole file is kept,
# notices included.

[libm.clarify]
license = "MIT"
[[libm.clarify.files]]
path = "LICENSE.txt"
license = "MIT"
checksum = "3823dda7cf046602f4b4e77ec8e227863dc4736037cc85bb33d9f19febe16bb7"

