# The real-world corpus: open source B4X-compatible projects, referenced
# where they were published, never copied into this repository (see
# README.md). `cargo run -p ferro-corpus --bin ferro-corpus-fetch` downloads
# the files listed here into target/corpus and checks their SHA-256.
#
# [[project]]
# - name:        the project's folder in target/corpus.
# - source:      where the project was published, at the commit referenced.
# - repository:  the repository it comes from.
# - commit:      the commit referenced.
# - path:        the project's folder in the repository ("" for its root).
# - license:     the licence the repository publishes it under, and
#   license_url: its text, at the same commit.
# - product, app_type: from the project file.
# [[project.file]], one per file fetched: its name in `path`, and its SHA-256.

